[project]
name = "coding-team-prod"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flagembedding>=1.4.0",
    "hdbscan>=0.8.44",
    "jieba>=0.42.1",
    "json-repair>=0.61.7",
    "lxml>=6.0.2",
    "networkx>=3.6.1",
    "numpy>=2.4.1",
    "openai>=2.50.0",
    "opencc>=1.3.1",
    "openpyxl>=3.1.5",
    "oracledb>=3.4.1",
    "plotly>=6.7.0",
    "polars>=1.30.0",
    "pyarrow>=23.0.0",
    "python-calamine>=0.6.1",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.0",
    "sqlparse>=0.5.5",
    "streamlit>=1.53.1",
    "torch>=2.13.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
etl_test = "TRENDING_WORDS.etl_test:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["TRENDING_WORDS*", "src*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
